name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm # auto-caches based on lockfile

      - name: Install deps (clean)
        run: npm ci

      - name: Lint (optional)
        run: npm run lint --if-present

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests in CI mode
        run: npm test -- --ci

      - name: Build application
        run: npm run build
